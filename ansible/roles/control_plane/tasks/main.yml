---
- name: Check whether the cluster is already initialised
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: Run kubeadm init
  ansible.builtin.command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --apiserver-advertise-address={{ private_ip }}
    --apiserver-cert-extra-sans={{ ansible_host }}
    --node-name={{ inventory_hostname }}
  when: not admin_conf.stat.exists

- name: Ensure .kube directory exists
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"

- name: Set up kubeconfig for the ubuntu user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Install Calico CNI
  become: false
  ansible.builtin.command: >
    kubectl apply -f
    https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml
  register: calico
  changed_when: "'created' in calico.stdout"

- name: Generate worker join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_cmd
  changed_when: false

- name: Share join command with workers
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ join_cmd.stdout }}"

- name: Fetch kubeconfig to the admin machine
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubeconfig_local_path }}"
    flat: true

- name: Point local kubeconfig at the public API endpoint
  delegate_to: localhost
  become: false
  ansible.builtin.replace:
    path: "{{ kubeconfig_local_path }}"
    regexp: 'server: https://[0-9.]+:6443'
    replace: "server: https://{{ ansible_host }}:6443"
